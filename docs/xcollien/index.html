<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xCOLLIEN</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>

    <div class="logo-area">

        <div class="logo">
            <span class="orange">x</span>COLLIEN
        </div>

        <div class="de-box">DE</div>

    </div>

    <div class="search-box">
        <label>Suchfeld</label>
        <input class="search" type="text" placeholder="gebe deine Suche ein...">
    </div>

</header>

<nav>
    <a href="#">GESICHT</a>
    <a href="#">DATENSATZ</a>
    <a href="#">PROMOTION</a>
    <a href="#">VERBREITEN</a>
    <a href="#">LÖSCHEN</a>
</nav>

<main>

<h1>WÄHLE EINE PERSON AUS:</h1>

<div class="overview">
    <button id="showAll">Gesamte Übersicht</button>
</div>

<div class="buttons">

    <button class="filter-btn active" data-filter="1">Ehefrau</button>
    <button class="filter-btn" data-filter="2">Lehrerin</button>
    <button class="filter-btn" data-filter="3">Mitbewohnerin</button>
    <button class="filter-btn" data-filter="4">Kollegin</button>

    <button class="filter-btn" data-filter="5">Nachbarin</button>
    <button class="filter-btn" data-filter="6">Exfreundin</button>
    <button class="filter-btn" data-filter="7">Bekannte</button>
    <button class="filter-btn" data-filter="8">Influencerin</button>

</div>

<div class="gallery"></div>

</main>

<script src="script.js"></script>

</body>
</html>
